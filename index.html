<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SolarShare — P2P Renewable Energy Trading</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    body {
      font-family: 'Hanken Grotesk', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      display: inline-block;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .energy-glow {
      box-shadow: 0 0 32px rgba(34, 197, 94, 0.18);
    }

    .input-focus-ring:focus-within {
      border-color: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px)
      }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-screen { animation: fadeUp 0.4s ease-out forwards; }
    
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(34,197,94,0.2); }
      50% { box-shadow: 0 0 30px rgba(34,197,94,0.6); }
    }
    .smart-meter-glow { animation: pulse-glow 2s infinite; border: 2px solid #22c55e; }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .spin {
      animation: spin 1s linear infinite;
      display: inline-block;
    }
  </style>
</head>

<body class="bg-[#f8f9ff] text-[#0b1c30] antialiased">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const SUPA_URL = 'https://ydfvybwcbsptwtlwrsjf.supabase.co';
    const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkZnZ5YndjYnNwdHd0bHdyc2pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDMxNzIsImV4cCI6MjEwMzgxOTE3Mn0.hmmNq7-rv2Z406-ZMRsh__tuV2bq-9Q9JHjmj6JGOe0';
    const sb = window.supabase.createClient(SUPA_URL, SUPA_ANON, {
      auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage }
    });

    function App() {
      const [authUser, setAuthUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [ready, setReady] = useState(false);
      const [screen, setScreen] = useState('login');
      const [sellers, setSellers] = useState([]);
      const [txns, setTxns] = useState([]);
      const [toasts, setToasts] = useState([]);
      const [showFunds, setShowFunds] = useState(false);
      const [fundsAmt, setFundsAmt] = useState('500');
      const [selSellerId, setSelSellerId] = useState(null);

      const toast = (msg, type = 'ok') => {
        const id = Date.now();
        setToasts(p => [...p, { id, msg, type }]);
        setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
      };

      const loadProfile = async (uid, sessionUser) => {
        const { data, error } = await sb.from('profiles').select('*').eq('id', uid).single();
        if (error || !data) {
          console.error("Profile Error, trying to auto-create:", error);
          const mockProfile = { id: uid, name: sessionUser?.user_metadata?.name || 'Demo User', role: sessionUser?.user_metadata?.role || 'Prosumer', flat_no: sessionUser?.user_metadata?.flat_no || 'A-101', meter_id: 'SM-AUTO', discom: 'BSES', balance: 150.00, surplus: 5.0 };
          await sb.from('profiles').insert(mockProfile).catch(e => console.log(e));
          setProfile(mockProfile);
          toast("Connected to Demo Profile", "ok");
        } else {
          setProfile(data);
        }
      };
      const loadTxns = async (uid) => {
        const { data } = await sb.from('transactions').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(50);
        setTxns(data || []);
      };
      const loadMarket = async () => {
        const { data } = await sb.from('market_listings').select('*').eq('status', 'active').order('created_at', { ascending: false });
        setSellers((data || []).map(l => ({
          id: l.id, name: l.seller_name, location: l.location || 'Greenwood Heights',
          distance: l.distance, kwh: l.units, pricePerKwh: l.price, rating: 4.8, verified: true,
          avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(l.seller_name)}&background=22c55e&color=fff&bold=true`
        })));
      };

      useEffect(() => {
        sb.auth.onAuthStateChange(async (event, session) => {
          if (session?.user && event === 'SIGNED_IN') {
            setAuthUser(session.user);
            await loadProfile(session.user.id, session.user);
            await loadTxns(session.user.id);
            await loadMarket();
            setScreen('home'); setReady(true);
            sb.channel('ss-mkt')
              .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'market_listings', filter: 'status=eq.active' }, p => {
                const l = p.new;
                setSellers(prev => {
                  if (prev.some(x => x.id === l.id)) return prev;
                  return [{ id: l.id, name: l.seller_name, location: l.location || 'Society', distance: l.distance, kwh: l.units, pricePerKwh: l.price, rating: 4.8, verified: true, avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(l.seller_name)}&background=22c55e&color=fff&bold=true` }, ...prev];
                });
              })
              .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'market_listings' }, p => {
                if (p.new.status === 'sold') setSellers(prev => prev.filter(s => s.id !== p.new.id));
              }).subscribe();
          } else if (!session) {
            setAuthUser(null); setProfile(null); setTxns([]); setSellers([]); setScreen('login'); setReady(true);
          }
        });
        sb.auth.getSession().then(async ({ data: { session }, error }) => { 
          if (error || !session) { setReady(true); } 
          else {
            setAuthUser(session.user);
            await loadProfile(session.user.id, session.user).catch(console.error);
            await loadTxns(session.user.id).catch(console.error);
            await loadMarket().catch(console.error);
            setScreen('home'); setReady(true);
          }
        }).catch((err) => {
          console.error("Session fetch failed", err);
          setReady(true);
        });
      }, []);

      const handleLogin = async (email, password) => {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { toast(error.message, 'err'); return false; }
        return true;
      };
      const handleSignup = async ({ fullName, email, password, unit, role, meterId, discom }) => {
        const { error } = await sb.auth.signUp({ email, password, options: { data: { name: fullName, role: role || 'Prosumer', flat_no: unit, meter_id: meterId || 'SM-AUTO', discom: discom || 'BSES Rajdhani' } } });
        if (error) { toast(error.message, 'err'); return false; }
        toast('Check your email to confirm your account!'); return true;
      };
      const handleSignOut = async () => { await sb.auth.signOut(); toast('Signed out.'); };

      const handleBuy = async (seller, kwh, energyCost) => {
        if (!authUser || !profile) return;
        const totalCost = energyCost + (kwh * 0.21);
        const newBal = Math.max(0, profile.balance - totalCost);
        setProfile(p => ({ ...p, balance: newBal })); 
        setSellers(p => p.filter(s => s.id !== seller.id)); 
        const tx = { id: `tx-${Date.now()}`, user_id: authUser.id, type: 'bought', title: `Bought from ${seller.name}`, kwh, price_per_kwh: seller.pricePerKwh, amount: totalCost, hash: `0x${Math.random().toString(16).substr(2, 4)}...${Math.random().toString(16).substr(2, 4)}`, date_label: 'Just now', counterparty: seller.name, status: 'Completed' };
        setTxns(p => [tx, ...p]);
        toast(`Purchased ${kwh} kWh from ${seller.name} (₹${totalCost.toFixed(2)})`);
        try {
          await sb.from('profiles').update({ balance: newBal }).eq('id', authUser.id);
          await sb.from('market_listings').update({ status: 'sold' }).eq('id', seller.id);
          await sb.from('transactions').insert(tx);
        } catch (e) { console.error("DB Write Failed", e); }
      };

      const handleSell = async (units, price, net) => {
        if (!authUser || !profile) return;
        const newSurplus = Math.max(0, (profile.surplus || 0) - units);
        const newBal = (profile.balance || 0) + net;
        const randomDist = (Math.random() * 2.0 + 0.1).toFixed(1) + 'km';
        const listing = { id: `listing-${Date.now()}`, seller_id: authUser.id, seller_name: profile.name, units, price, distance: randomDist, location: profile.flat_no || 'Your Block', status: 'active', rating: 5.0 };
        setProfile(p => ({ ...p, surplus: newSurplus, balance: newBal })); 
        const tx = { id: `tx-${Date.now()}`, user_id: authUser.id, type: 'sold', title: 'Published to P2P Microgrid', kwh: units, price_per_kwh: price, amount: net, hash: `0x${Math.random().toString(16).substr(2, 4)}...${Math.random().toString(16).substr(2, 4)}`, date_label: 'Just now', counterparty: 'P2P Grid', status: 'Completed' };
        setTxns(p => [tx, ...p]);
        setSellers(prev => [{ id: listing.id, name: listing.seller_name, location: listing.location, distance: listing.distance, kwh: listing.units, pricePerKwh: listing.price, rating: 5.0, verified: true, avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(listing.seller_name)}&background=22c55e&color=fff&bold=true` }, ...prev]);
        toast(`Listed ${units} kWh @ ₹${price.toFixed(2)}/u (+₹${net.toFixed(2)})`);
        try {
          await sb.from('market_listings').insert(listing);
          await sb.from('profiles').update({ surplus: newSurplus, balance: newBal }).eq('id', authUser.id);
          await sb.from('transactions').insert(tx);
        } catch (e) { console.error("DB Write Failed", e); }
      };

      const handleTopUp = async () => {
        const amt = parseFloat(fundsAmt) || 0;
        if (amt <= 0 || !authUser) return;
        const newBal = (profile.balance || 0) + amt;
        await sb.from('profiles').update({ balance: newBal }).eq('id', authUser.id);
        setProfile(p => ({ ...p, balance: newBal })); setShowFunds(false);
        toast(`Added ₹${amt.toFixed(2)} to wallet!`);
      };

      if (!ready) return (
        <div className="min-h-screen flex flex-col items-center justify-center bg-[#0b1c30] text-white">

        <div className="flex-1 flex flex-col min-h-screen bg-[#f0f7f0] animate-screen">

    function CreateAccountScreen({ onNavigate, onSignup }) {
      const [f, setF] = useState({ fullName: '', email: '', password: '', unit: '', role: 'Prosumer', meterId: '', discom: 'BSES Rajdhani' });
      const [loading, setLoading] = useState(false); const [msg, setMsg] = useState('');
      const set = (k, v) => setF(p => ({ ...p, [k]: v }));
      const submit = async e => { e.preventDefault(); setLoading(true); const ok = await onSignup(f); if (ok) setMsg('Check your email to confirm!'); setLoading(false); };
      return (
        <div className="flex-1 flex flex-col px-5 max-w-md mx-auto w-full min-h-screen py-8 animate-screen">
          <header className="flex items-center justify-between mb-6">
            <button onClick={() => onNavigate('login')} className="w-10 h-10 rounded-full bg-slate-200/60 flex items-center justify-center"><span className="material-symbols-outlined text-[22px]">arrow_back</span></button>
            <span className="font-bold text-[18px] text-[#006e2f]">Join SolarShare</span>
            <div className="w-10"></div>
          </header>
          <h2 className="text-[26px] font-bold text-[#0b1c30] mb-1">Create Account</h2>
          <p className="text-[14px] text-[#565e74] mb-5">Start trading clean solar energy in your housing society.</p>
          {msg && <div className="mb-4 p-3 bg-emerald-50 text-emerald-800 text-sm rounded-xl border border-emerald-200 font-medium">{msg}</div>}
          <form onSubmit={submit} className="flex flex-col gap-3">
            <input type="text" required placeholder="Full Name" value={f.fullName} onChange={e => set('fullName', e.target.value)} className="w-full h-13 px-4 bg-white border rounded-xl text-sm focus:outline-none input-focus-ring" />
            <input type="email" required placeholder="Email Address" value={f.email} onChange={e => set('email', e.target.value)} className="w-full h-13 px-4 bg-white border rounded-xl text-sm focus:outline-none input-focus-ring" />
            <input type="text" required placeholder="Flat / Unit No. (e.g. A-302)" value={f.unit} onChange={e => set('unit', e.target.value)} className="w-full h-13 px-4 bg-white border rounded-xl text-sm focus:outline-none input-focus-ring" />
            <input type="text" placeholder="Smart Meter ID (e.g. SM-12345)" value={f.meterId} onChange={e => set('meterId', e.target.value)} className="w-full h-13 px-4 bg-white border rounded-xl text-sm focus:outline-none input-focus-ring" />
            <div className="grid grid-cols-2 gap-3">
              <select value={f.role} onChange={e => set('role', e.target.value)} className="h-13 px-4 bg-white border rounded-xl text-sm focus:outline-none input-focus-ring">
                <option>Prosumer</option><option>Consumer</option>
              </select>
              <select value={f.discom} onChange={e => set('discom', e.target.value)} className="h-13 px-4 bg-white border rounded-xl text-sm focus:outline-none input-focus-ring">
                <option>BSES Rajdhani</option><option>BSES Yamuna</option><option>Tata Power</option><option>MSEDCL</option><option>BESCOM</option><option>TNEB</option><option>CESC</option>
              </select>
            </div>
            <input type="password" required placeholder="Password (min 6 chars)" value={f.password} onChange={e => set('password', e.target.value)} className="w-full h-13 px-4 bg-white border rounded-xl text-sm focus:outline-none input-focus-ring" />
            <button type="submit" disabled={loading} className="w-full h-13 bg-[#22c55e] hover:bg-[#006e2f] text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2 mt-2 disabled:opacity-60">
              {loading && <span className="spin material-symbols-outlined text-[20px]">autorenew</span>}
              {loading ? 'Creating...' : 'Register & Get ₹150 Starting Credit'}
            </button>
          </form>
          <div className="text-center mt-auto pb-4 text-sm text-slate-600 pt-6">Already have an account?{' '}<button onClick={() => onNavigate('login')} className="text-[#006e2f] font-bold hover:underline">Log In</button></div>
        </div>
      );
    }

    // MARKET
    function MarketScreen({ sellers, userBal, initSellerId, onBuy, onNavigate, onAddFunds }) {
      const [search, setSearch] = useState(''); const [filter, setFilter] = useState('All'); const [sel, setSel] = useState(null); const [kwh, setKwh] = useState(2); const [procState, setProcState] = useState('');
      useEffect(() => { if (initSellerId) { const m = sellers.find(s => s.id === initSellerId); if (m) setSel(m); } }, [initSellerId, sellers]);
      const filtered = sellers.filter(s => { const q = s.name.toLowerCase().includes(search.toLowerCase()) || (s.location || '').toLowerCase().includes(search.toLowerCase()); if (!q) return false; if (filter === 'Nearby') return parseFloat(s.distance) <= 0.5; return true; }).sort((a, b) => filter === 'Lowest Price' ? a.pricePerKwh - b.pricePerKwh : 0);
      const cost = sel ? Number((kwh * sel.pricePerKwh).toFixed(2)) : 0; 
      const totalFee = kwh * 0.21;
      const finalCost = cost + totalFee;
      const insuf = finalCost > userBal;
      const confirm = () => { 
        if (!sel || insuf) return; 
        setProcState('Locating Seller...'); 
        setTimeout(() => {
          setProcState('Verifying Grid Connection...');
          setTimeout(async () => {
            setProcState('Transferring Energy...');
            setTimeout(async () => {
              await onBuy(sel, kwh, cost); 
              setProcState(''); 
              setSel(null); 
            }, 800);
          }, 800);
        }, 800);
      };
      return (
        <div className="flex-1 flex flex-col pb-24 animate-screen">
          <header className="sticky top-0 z-40 bg-[#f8f9ff]/90 backdrop-blur-md px-5 h-16 border-b flex items-center justify-between">

            <div className="bg-emerald-50 text-[#006e2f] px-3 py-1 rounded-full text-xs font-bold border border-emerald-200">₹{userBal.toFixed(2)}</div>
          </header>
          <main className="px-5 pt-4 max-w-2xl mx-auto w-full space-y-4">
            <div className="relative flex items-center bg-white rounded-2xl border px-3 h-12 shadow-sm input-focus-ring"><span className="material-symbols-outlined text-slate-400 mr-2 text-[20px]">search</span><input type="text" placeholder="Search neighbor or block..." value={search} onChange={e => setSearch(e.target.value)} className="w-full bg-transparent text-sm focus:outline-none" /></div>
            <div className="flex gap-2 overflow-x-auto pb-1 no-scrollbar">{['All', 'Nearby', 'Lowest Price'].map(f => <button key={f} onClick={() => setFilter(f)} className={`px-4 py-1.5 rounded-full text-xs font-bold border ${filter === f ? 'bg-[#006e2f] text-white border-transparent' : 'bg-white text-slate-600'}`}>{f}</button>)}</div>
            {filtered.length === 0
              ? <div className="bg-white rounded-2xl border p-8 text-center text-sm text-slate-400"><span className="material-symbols-outlined text-[36px] block mb-2">solar_power</span>No active sellers right now.</div>
              : <div className="space-y-3">{filtered.map(s => (
                <div key={s.id} className="bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between">
                  <div className="flex items-center gap-3"><img src={s.avatar} alt={s.name} className="w-12 h-12 rounded-full object-cover border" /><div><h4 className="font-bold text-[15px] text-[#0b1c30]">{s.name}</h4><p className="text-xs text-slate-500">{s.location} • {s.distance}</p><span className="inline-block mt-1 text-[11px] font-bold text-[#006e2f] bg-emerald-50 px-2 py-0.5 rounded-md">{s.kwh} kWh Available</span></div></div>
                  <div className="text-right"><div className="text-[17px] font-black text-[#006e2f]">₹{s.pricePerKwh.toFixed(2)}<span className="text-xs font-normal text-slate-500">/u</span></div><button onClick={() => { setSel(s); setKwh(Math.min(2, s.kwh)); }} className="mt-1 px-4 py-2 bg-[#22c55e] hover:bg-[#006e2f] text-white rounded-xl text-xs font-bold shadow-sm">Buy Energy</button></div>
                </div>
              ))}</div>
            }
          </main>
          {sel && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl flex flex-col gap-4">
                <div className="flex justify-between items-center pb-2 border-b"><h3 className="font-bold text-[18px]">Confirm Purchase</h3><button onClick={() => setSel(null)} className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center"><span className="material-symbols-outlined text-[18px]">close</span></button></div>
                {procState ? (
                  <div className="py-10 flex flex-col items-center justify-center text-center animate-fade-up">
                    <span className="spin material-symbols-outlined text-[56px] text-[#22c55e] mb-4">autorenew</span>
                    <h4 className="font-bold text-[20px] text-slate-800">{procState}</h4>
                    <p className="text-sm text-slate-500 mt-2">Securing P2P blockchain transaction...</p>
                  </div>
                ) : (
                  <>
                    <div className="flex items-center gap-3 p-3 bg-emerald-50/50 rounded-2xl border border-emerald-100"><img src={sel.avatar} alt={sel.name} className="w-10 h-10 rounded-full" /><div><h5 className="font-bold text-sm">{sel.name}</h5><p className="text-xs text-slate-500">₹{sel.pricePerKwh.toFixed(2)}/kWh</p></div></div>
                    <div><label className="text-xs font-bold text-slate-600 block mb-1">Select Units (kWh)</label><div className="flex items-center gap-2"><button onClick={() => setKwh(p => Math.max(0.5, Number((p - 0.5).toFixed(1))))} className="w-11 h-11 bg-slate-100 rounded-xl font-bold text-lg">-</button><input type="number" step="0.5" min="0.5" max={sel.kwh} value={kwh} onChange={e => setKwh(Math.min(sel.kwh, Math.max(0.5, parseFloat(e.target.value) || 0.5)))} className="w-full h-11 border text-center font-bold rounded-xl" /><button onClick={() => setKwh(p => Math.min(sel.kwh, Number((p + 0.5).toFixed(1))))} className="w-11 h-11 bg-slate-100 rounded-xl font-bold text-lg">+</button></div></div>
                    <div className="bg-slate-50 p-3 rounded-xl space-y-1.5 text-xs text-slate-600"><div className="flex justify-between"><span>Energy Cost:</span><span className="font-bold text-slate-800">₹{cost.toFixed(2)}</span></div><div className="flex justify-between"><span>Platform Fee:</span><span className="text-emerald-600 font-bold">₹{totalFee.toFixed(2)}</span></div><div className="flex justify-between pt-1 border-t text-sm font-black text-[#006e2f]"><span>Total:</span><span>₹{finalCost.toFixed(2)}</span></div></div>
                    {insuf && <div className="p-2.5 bg-red-50 text-red-700 text-xs rounded-xl flex justify-between items-center"><span>Insufficient balance</span><button onClick={() => { setSel(null); onAddFunds(); }} className="font-bold underline">Add Funds</button></div>}
                    <button disabled={insuf} onClick={confirm} className={`w-full h-12 rounded-xl font-bold text-sm text-white flex items-center justify-center gap-2 ${insuf ? 'bg-slate-300' : 'bg-[#22c55e] hover:bg-[#006e2f] shadow-lg transition-transform active:scale-95'}`}>
                      Confirm & Pay ₹{finalCost.toFixed(2)}
                    </button>
                  </>
                )}
              </div>
            </div>
          )}
          <BottomNav current="marketplace" onNavigate={onNavigate} />
        </div>
      );
    }

    // SELL
    function SellScreen({ surplus, onSell, onNavigate }) {
      const [units, setUnits] = useState(Math.min(3.0, surplus || 0)); const [price, setPrice] = useState(5.5); const [pub, setPub] = useState(false);
      const gross = units * price; const fee = units * 0.21; const net = Math.max(0, gross - fee);
      const submit = async e => { e.preventDefault(); if (units <= 0) return; setPub(true); await onSell(units, price, net); setPub(false); onNavigate('marketplace'); };
      return (
        <div className="flex-1 flex flex-col pb-24 animate-screen">
          <header className="sticky top-0 z-40 bg-[#f8f9ff]/90 backdrop-blur-md px-5 h-16 border-b flex items-center justify-between">
            <div className="flex items-center gap-3"><button onClick={() => onNavigate('home')} className="w-9 h-9 rounded-full bg-slate-200/60 flex items-center justify-center"><span className="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 className="text-[18px] font-bold text-[#006e2f]">Sell Surplus Energy</h1></div>
          </header>
          <main className="px-5 pt-4 max-w-2xl mx-auto w-full space-y-5">
            <div className="glass-panel rounded-3xl p-6 border shadow-sm text-center energy-glow">
              <span className="text-xs text-slate-500 font-bold uppercase tracking-wider block">Available to Sell</span>
              <div className="text-[44px] font-black text-[#006e2f] leading-none my-2">{surplus.toFixed(1)} <span className="text-lg font-normal text-slate-500">kWh</span></div>
              <span className="text-xs text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full font-bold">● Smart Meter Connected</span>
            </div>
            <form onSubmit={submit} className="flex flex-col gap-4">
              <div><label className="text-xs font-bold text-slate-700 block mb-1">Units to Sell (kWh)</label><input type="number" step="0.1" min="0.1" max={surplus} value={units} onChange={e => setUnits(parseFloat(e.target.value) || 0)} className="w-full h-13 px-4 bg-white border rounded-xl font-bold text-lg focus:outline-none input-focus-ring" /></div>
              <div>
                <div className="flex justify-between items-center mb-1"><label className="text-xs font-bold text-slate-700">Price per kWh (₹)</label><button type="button" onClick={() => setPrice(5.5)} className="text-xs text-emerald-600 font-bold">Suggested: ₹5.50</button></div>
                <input type="number" step="0.1" value={price} onChange={e => setPrice(parseFloat(e.target.value) || 0)} className="w-full h-13 px-4 bg-white border rounded-xl font-bold text-lg focus:outline-none input-focus-ring" />
                <div className="flex gap-2 mt-2"><button type="button" onClick={() => setPrice(3.5)} className="px-3 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">DISCOM: ₹3.50</button><button type="button" onClick={() => setPrice(8.0)} className="px-3 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">Grid Max: ₹8.00</button></div>
              </div>
              <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-2 text-xs text-slate-600">
                <div className="flex justify-between"><span>Gross:</span><span className="font-bold text-slate-800">₹{gross.toFixed(2)}</span></div>
                <div className="flex justify-between"><span>Platform Fee (₹0.21/u):</span><span className="text-red-500 font-bold">-₹{fee.toFixed(2)}</span></div>
                <div className="flex justify-between pt-2 border-t text-sm font-black text-[#006e2f]"><span>Net Earnings:</span><span>₹{net.toFixed(2)}</span></div>
              </div>
              <button type="submit" disabled={pub || units <= 0 || units > surplus} className="w-full h-13 bg-[#22c55e] hover:bg-[#006e2f] text-white font-bold rounded-xl flex items-center justify-center gap-2 mt-2 disabled:opacity-60">
                {pub && <span className="spin material-symbols-outlined text-[20px]">autorenew</span>}
                <span className="material-symbols-outlined text-[20px]">publish</span>
                <span>{pub ? 'Publishing...' : 'Publish to P2P Grid'}</span>
              </button>
            </form>
          </main>
          <BottomNav current="sell_surplus" onNavigate={onNavigate} />
        </div>
      );
    }

    // PROFILE
    function ProfileScreen({ profile, onNavigate, onAddFunds, onSignOut }) {
      const av = `https://ui-avatars.com/api/?name=${encodeURIComponent(profile.name || 'User')}&background=22c55e&color=fff&bold=true&size=128`;
      const menu = [
        { icon: 'person', label: 'Personal Info' },
        { icon: 'speed', label: 'Smart Meter' },
        { icon: 'credit_card', label: 'Payment Methods' },
        { icon: 'notifications', label: 'Notifications' },
        { icon: 'help', label: 'Help & Support' }
      ];
      return (
        <div className="flex-1 flex flex-col pb-24 animate-screen">
          <header className="sticky top-0 z-40 bg-[#f8f9ff]/90 backdrop-blur-md px-5 h-16 border-b flex items-center justify-between"><h1 className="text-[18px] font-bold text-[#006e2f]">My Profile</h1></header>
          <main className="px-5 pt-4 max-w-2xl mx-auto w-full space-y-5">
            <div className="flex flex-col items-center text-center"><img src={av} alt={profile.name} className="w-24 h-24 rounded-full border-4 border-white shadow-md mb-2" /><h2 className="text-[22px] font-bold text-[#0b1c30]">{profile.name}</h2><p className="text-xs text-slate-500">{profile.role} • {profile.flat_no}</p><span className="mt-1 text-[11px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-bold">{profile.discom}</span></div>
            <div className="bg-white p-5 rounded-3xl border shadow-sm"><div className="flex justify-between items-center"><div><span className="text-xs text-slate-500 uppercase font-bold block">Wallet Balance</span><div className="text-[28px] font-black text-[#0b1c30]">₹{(profile.balance || 0).toFixed(2)}</div></div><button onClick={onAddFunds} className="px-4 py-2 bg-[#22c55e] text-white rounded-xl text-xs font-bold shadow-sm">Add Funds</button></div></div>
            
            <div className="space-y-3">
              {menu.map((m, i) => (
                <button key={i} onClick={() => toast(m.label + ' coming soon!')} className="w-full bg-white p-4 rounded-2xl border shadow-sm flex items-center justify-between active:scale-95 transition-transform hover:bg-slate-50">
                  <div className="flex items-center gap-4">
                    <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
                      <span className="material-symbols-outlined text-[20px]">{m.icon}</span>
                    </div>
                    <span className="font-semibold text-slate-700 text-[15px]">{m.label}</span>
                  </div>
                  <span className="material-symbols-outlined text-slate-400 text-[24px]">chevron_right</span>
                </button>
              ))}
            </div>

            <button onClick={onSignOut} className="w-full h-14 border-2 border-red-100 text-red-600 rounded-2xl font-bold text-sm bg-red-50 hover:bg-red-100 transition-colors flex items-center justify-center gap-2 mt-2 shadow-sm"><span className="material-symbols-outlined text-[20px]">logout</span> Log Out</button>
          </main>
          <BottomNav current="profile" onNavigate={onNavigate} />
        </div>
      );
    }

    // TRANSACTIONS
    function TxScreen({ txns, onNavigate }) {
      const [filter, setFilter] = useState('all'); const [rec, setRec] = useState(null);
      const filtered = txns.filter(t => filter === 'all' ? true : t.type === filter);
      return (
        <div className="flex-1 flex flex-col pb-24 animate-screen">
          <header className="sticky top-0 z-40 bg-[#f8f9ff]/90 backdrop-blur-md px-5 h-16 border-b flex items-center justify-between"><h1 className="text-[18px] font-bold text-[#006e2f]">Transaction Ledger</h1><span className="text-xs text-slate-500 bg-white border px-2 py-1 rounded-full">{txns.length} records</span></header>
          <main className="px-5 pt-4 max-w-2xl mx-auto w-full space-y-4">
            <div className="flex gap-2">{['all', 'bought', 'sold'].map(f => <button key={f} onClick={() => setFilter(f)} className={`px-4 py-1.5 rounded-full text-xs font-bold uppercase ${filter === f ? 'bg-[#006e2f] text-white' : 'bg-white text-slate-600 border'}`}>{f}</button>)}</div>
            {filtered.length === 0
              ? <div className="bg-white rounded-2xl border p-8 text-center text-sm text-slate-400"><span className="material-symbols-outlined text-[36px] block mb-2">receipt_long</span>No transactions yet.</div>
              : <div className="space-y-2.5">{filtered.map(tx => (
                <div key={tx.id} onClick={() => setRec(tx)} className="bg-white p-3.5 rounded-2xl border shadow-sm flex items-center justify-between cursor-pointer hover:bg-slate-50">
                  <div className="flex items-center gap-3"><div className={`w-9 h-9 rounded-full flex items-center justify-center ${tx.type === 'bought' ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-[#006e2f]'}`}><span className="material-symbols-outlined text-[18px]">{tx.type === 'bought' ? 'arrow_downward' : 'arrow_upward'}</span></div><div><h4 className="font-bold text-xs text-slate-800">{tx.title}</h4><p className="text-[11px] text-slate-500 font-mono">{tx.kwh} kWh • {tx.hash}</p></div></div>
                  <div className="text-right"><div className={`font-black text-sm ${tx.type === 'bought' ? 'text-red-600' : 'text-[#006e2f]'}`}>{tx.type === 'bought' ? '-' : '+'}₹{(tx.amount || 0).toFixed(2)}</div><span className="text-[10px] text-slate-400">{tx.date_label || 'Recent'}</span></div>
                </div>
              ))}</div>
            }
          </main>
          {rec && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl flex flex-col gap-3">
                <div className="flex justify-between items-center pb-2 border-b"><h3 className="font-bold text-base text-[#006e2f]">Smart Contract Receipt</h3><button onClick={() => setRec(null)} className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center"><span className="material-symbols-outlined text-[18px]">close</span></button></div>
                <div className="text-center py-2"><div className="text-[28px] font-black text-slate-900">{rec.type === 'bought' ? '-' : '+'}₹{(rec.amount || 0).toFixed(2)}</div><span className="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full">IEEE 2030.5 Cleared</span></div>
                <div className="bg-slate-50 p-3 rounded-xl space-y-1 text-xs text-slate-600">
                  <div className="flex justify-between"><span>Title:</span><span className="font-bold text-slate-800">{rec.title}</span></div>
                  <div className="flex justify-between"><span>Energy:</span><span className="font-bold text-slate-800">{rec.kwh} kWh</span></div>
                  <div className="flex justify-between"><span>Counterparty:</span><span className="font-bold text-slate-800">{rec.counterparty}</span></div>
                  <div className="flex justify-between"><span>Hash:</span><span className="font-mono text-[10px] text-[#006e2f]">{rec.hash}</span></div>
                </div>
                <button onClick={() => setRec(null)} className="w-full h-11 bg-[#006e2f] text-white rounded-xl text-xs font-bold">Done</button>
              </div>
            </div>
          )}
          <BottomNav current="transactions" onNavigate={onNavigate} />
        </div>
      );
    }

    // BOTTOM NAV
    function BottomNav({ current, onNavigate }) {
      const items = [{ id: 'home', icon: 'home', label: 'Home' }, { id: 'marketplace', icon: 'storefront', label: 'Market' }, { id: 'sell_surplus', icon: 'add_circle', label: 'Sell', isFab: true }, { id: 'transactions', icon: 'receipt_long', label: 'History' }, { id: 'profile', icon: 'person', label: 'Profile' }];
      return (
        <nav className="fixed bottom-0 left-0 right-0 h-16 bg-white/95 backdrop-blur-md border-t flex justify-around items-center z-40 px-2 shadow-lg">
          {items.map(item => {
            const a = current === item.id; return item.isFab ? (
              <button key={item.id} onClick={() => onNavigate(item.id)} className="flex flex-col items-center justify-center -mt-6 active:scale-95 transition-transform cursor-pointer">
                <div className="w-13 h-13 bg-[#22c55e] text-white rounded-full flex items-center justify-center shadow-lg border-4 border-white"><span className="material-symbols-outlined text-[26px]">add</span></div>
                <span className="text-[11px] font-bold text-[#006e2f] mt-0.5">Sell</span>
              </button>
            ) : (
              <button key={item.id} onClick={() => onNavigate(item.id)} className={`flex flex-col items-center justify-center w-14 h-full cursor-pointer transition-all ${a ? 'text-[#006e2f] font-bold' : 'text-slate-400 hover:text-slate-600'}`}>
                <span className="material-symbols-outlined text-[22px]">{item.icon}</span>
                <span className="text-[11px] mt-0.5">{item.label}</span>
              </button>
            );
          })}
        </nav>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
